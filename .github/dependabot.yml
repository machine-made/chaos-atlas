version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    groups:
      github-actions-updates:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    groups:
      npm-updates:
        patterns:
          - "*"
    ignore:
      # typescript-eslint (via eslint-config-next) rejects TypeScript 7:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/python"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    groups:
      pip-python-updates:
        patterns:
          - "*"
